name: Testing macOS Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. testing-macos-beta or v1.0.0-macos)'
        required: true
        default: 'testing-macos-beta'
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: true
  push:
    tags:
      - 'testing-macos*'
      - 'macos-v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: internal/gui/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        run: npm --prefix internal/gui/frontend ci

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "version=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=testing-macos" >> $GITHUB_OUTPUT
          fi

      - name: Build Application (Universal macOS)
        shell: bash
        run: |
          wails build -platform darwin/universal -ldflags "-X main.version=${{ steps.ver.outputs.version }}"

      - name: Package macOS Archive
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/bin/captive-bypass.app "dist/captive-bypass-darwin-universal.zip"
          cd dist
          shasum -a 256 captive-bypass-darwin-universal.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "Testing macOS (${{ steps.ver.outputs.version }})"
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}
          files: |
            dist/captive-bypass-darwin-universal.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
